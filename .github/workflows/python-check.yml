name: Python checks

on:
  push:
    branches: [rewrite]
  pull_request:
    branches: [rewrite]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q config.py db.py handlers.py main.py
      - run: python -c "import config, db, handlers, main"
