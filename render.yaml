services:
  - type: web
    name: swiggy-palace-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_PATH
        value: /var/data/palace.db
      - key: PORT
        value: 10000
    disk:
      name: palace-data
      mountPath: /var/data
      sizeGB: 1
